[project]
name = "us-visa-bulletin-forecast"
version = "0.1.0"
description = "Predict US employment-based green card timelines using deep learning on visa bulletin data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "ipykernel>=6.27",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
