[project]
name = "us-visa-bulletin-forecast"
version = "0.1.0"
description = "Predict US employment-based green card timelines using deep learning on visa bulletin data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
timesfm = [
    "timesfm[torch]>=1.3.0",
]
chronos = [
    "chronos-forecasting>=2.0",
]
moirai = [
    "uni2ts @ git+https://github.com/SalesforceAIResearch/uni2ts.git",
]
foundation = [
    "timesfm[torch]>=1.3.0",
    "chronos-forecasting>=2.0",
    "uni2ts @ git+https://github.com/SalesforceAIResearch/uni2ts.git",
]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "ipykernel>=6.27",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/us_visa_bulletin_forecast"]

[tool.ruff]
line-length = 100
